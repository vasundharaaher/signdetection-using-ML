<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }
        h1 {
            margin: 20px 0;
        }
        video {
            border: 2px solid #000;
            border-radius: 10px;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Sign Language Detection</h1>
    <div>
        <img src="{{ url_for('video_feed') }}" alt="Sign Language Detection Stream" id="video-frame">
    </div>
    <div class="controls">
        <button onclick="startPredicting()">Start Prediction</button>
        <button onclick="stopPredicting()">Stop Prediction</button>
    </div>
    

    <script>
        function startPredicting() {
            fetch('/start_predicting', {
                method: 'POST',
            }).then(response => response.json())
              .then(data => {
                  console.log(data.status);
              });
        }

        function stopPredicting() {
            fetch('/stop_predicting', {
                method: 'POST',
            }).then(response => response.json())
              .then(data => {
                  console.log(data.status);
              });
        }
    </script>
</body>
</html>
